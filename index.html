<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Calidad — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --bg:        #0d0f14;
    --bg2:       #13161e;
    --bg3:       #1a1e28;
    --border:    #252a38;
    --text:      #e8eaf0;
    --muted:     #6b7280;
    --blue:      #3b82f6;
    --green:     #10b981;
    --orange:    #f59e0b;
    --red:       #ef4444;
    --zuma:      #3b82f6;
    --gce:       #10b981;
    --phs:       #f59e0b;
    --radius:    12px;
    --font:      'DM Sans', sans-serif;
    --mono:      'DM Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    padding: 0;
  }

  /* ── Header ── */
  .header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--blue), var(--green));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .header-title { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .header-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .header-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
  .last-update { font-size: 12px; color: var(--muted); font-family: var(--mono); }
  .pdf-btn {
    background: linear-gradient(135deg, var(--blue), #2563eb);
    color: #fff;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 9px;
    padding: 9px 14px;
    font-family: var(--font);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .15s, filter .2s, opacity .2s;
    box-shadow: 0 8px 20px rgba(59,130,246,.18);
    white-space: nowrap;
  }
  .pdf-btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
  .pdf-btn:disabled { opacity: .55; cursor: wait; transform: none; }
  .pdf-exporting .header { position: static; }
  .pdf-exporting .pdf-btn { display: none; }

  .pdf-cover {
    display: none;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 16px;
  }
  .pdf-cover-title { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px; }
  .pdf-cover-sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .pdf-summary-grid { display: grid; grid-template-columns: repeat(5, minmax(120px, 1fr)); gap: 10px; }
  .pdf-summary-item { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .pdf-summary-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
  .pdf-summary-value { font-family: var(--mono); font-size: 18px; font-weight: 600; }
  .pdf-exporting .pdf-cover { display: block; }


  /* ── Main layout ── */
  .main { padding: 28px 32px; max-width: 1400px; margin: 0 auto; }

  /* ── Filters ── */
  .filters {
    display: flex;
    gap: 10px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-label { font-size: 12px; color: var(--muted); margin-right: 2px; }
  select {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
    outline: none;
    transition: border-color .2s;
  }
  select:hover, select:focus { border-color: var(--blue); }
  .filter-group { display: flex; align-items: center; gap: 8px; }
  .filter-divider { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }

  /* ── KPI cards ── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 28px;
  }
  .kpi {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    position: relative;
    overflow: hidden;
    transition: border-color .2s, transform .15s;
  }
  .kpi:hover { border-color: #3a3f52; transform: translateY(-1px); }
  .kpi::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent, var(--blue));
  }
  .kpi-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
  .kpi-value { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; font-family: var(--mono); }
  .kpi-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .kpi.danger { --accent: var(--red); }
  .kpi.warn   { --accent: var(--orange); }
  .kpi.ok     { --accent: var(--green); }
  .kpi.info   { --accent: var(--blue); }

  /* ── Chart grid ── */
  .chart-grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }
  .chart-grid-1 { margin-bottom: 16px; }

  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title::before {
    content: '';
    width: 3px; height: 14px;
    background: var(--accent, var(--blue));
    border-radius: 2px;
    flex-shrink: 0;
  }
  .card.green-accent  { --accent: var(--green); }
  .card.orange-accent { --accent: var(--orange); }
  .card.red-accent    { --accent: var(--red); }

  .legend {
    display: flex; flex-wrap: wrap; gap: 14px;
    margin-bottom: 14px;
  }
  .legend span {
    font-size: 12px; color: var(--muted);
    display: flex; align-items: center; gap: 5px;
  }
  .leg-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  canvas { display: block; }

  /* ── Animations ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .kpi       { animation: fadeUp .4s ease both; }
  .kpi:nth-child(1) { animation-delay: .05s; }
  .kpi:nth-child(2) { animation-delay: .10s; }
  .kpi:nth-child(3) { animation-delay: .15s; }
  .kpi:nth-child(4) { animation-delay: .20s; }
  .kpi:nth-child(5) { animation-delay: .25s; }
  .card      { animation: fadeUp .5s ease both; animation-delay: .3s; }

  /* ── Empty state ── */
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
    font-size: 15px;
    display: none;
  }
  .empty-icon { font-size: 40px; margin-bottom: 16px; opacity: .4; }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    .main { padding: 16px; }
    .header { padding: 14px 16px; gap: 12px; align-items: flex-start; }
    .header-actions { width: 100%; justify-content: flex-start; }
    .chart-grid-2 { grid-template-columns: 1fr; }
    .pdf-summary-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="logo">⚗️</div>
    <div>
      <div class="header-title">Control de Calidad</div>
      <div class="header-sub">Inspección de lotes por laboratorio</div>
    </div>
  </div>
  <div class="header-actions">
    <button id="btnPDF" class="pdf-btn" type="button">📄 Descargar PDF</button>
    <div class="last-update" id="lastUpdate">—</div>
  </div>
</header>

<main class="main">

  <section class="pdf-cover" id="pdfCover" aria-hidden="true">
    <div class="pdf-cover-title">Reporte de Control de Calidad</div>
    <div class="pdf-cover-sub" id="pdfExportMeta">Generado desde el dashboard</div>
    <div class="pdf-summary-grid" id="pdfSummaryGrid"></div>
  </section>

  <div class="filters" id="filtersRow">
    <div class="filter-group">
      <span class="filter-label">Laboratorio</span>
      <select id="filtLab"><option value="">Todos</option></select>
    </div>
    <div class="filter-divider"></div>
    <div class="filter-group">
      <span class="filter-label">Mes</span>
      <select id="filtMes"><option value="">Todos</option></select>
    </div>
    <div class="filter-divider"></div>
    <div class="filter-group">
      <span class="filter-label">Semana</span>
      <select id="filtSem"><option value="">Todas</option></select>
    </div>
  </div>

  <div class="kpi-grid" id="kpiGrid"></div>

  <div class="chart-grid-2">
    <div class="card">
      <div class="card-title">Recibido vs. Con incidencia</div>
      <div class="legend" id="legBar">
        <span><span class="leg-dot" style="background:#3b82f6"></span>Recibido</span>
        <span><span class="leg-dot" style="background:#ef4444"></span>Con incidencia</span>
      </div>
      <div style="height:230px"><canvas id="chartBar"></canvas></div>
    </div>
    <div class="card orange-accent">
      <div class="card-title">Tipos de incidencia</div>
      <div class="legend" id="legDef"></div>
      <div style="height:230px"><canvas id="chartDef"></canvas></div>
    </div>
  </div>

  <div class="chart-grid-1">
    <div class="card green-accent">
      <div class="card-title">% de incidencia diario</div>
      <div style="height:180px"><canvas id="chartLine"></canvas></div>
    </div>
  </div>

  <div class="chart-grid-1">
    <div class="card red-accent">
      <div class="card-title">% de incidencia por producto</div>
      <div class="legend" id="legProd"></div>
      <div id="prodWrap"></div>
    </div>
  </div>

</main>

<script>
// ─── Config: apunta a tu CSV en GitHub ───────────────────────────────────────
// Cambia esta URL por la de tu archivo RAW en GitHub:
// https://raw.githubusercontent.com/TU_USUARIO/TU_REPO/main/datos.csv
const CSV_URL = './datos.csv';
// ─────────────────────────────────────────────────────────────────────────────

const MESES = ["","Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const LAB_COLORS_DEFAULT = { "Zuma":"#3b82f6","GCE":"#10b981","PH&S":"#f59e0b" };
const PALETTE = ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#06b6d4'];
let LAB_COLORS = {...LAB_COLORS_DEFAULT};
let DATA = [];
let chartBar, chartDef, chartLine, chartProd;

const CHART_DEFAULTS = {
  plugins: { legend: { display: false }, tooltip: {
    backgroundColor: '#1a1e28', borderColor: '#252a38', borderWidth: 1,
    titleColor: '#e8eaf0', bodyColor: '#9ca3af', padding: 10,
    callbacks: {}
  }},
  scales: {
    x: { ticks: { color: '#6b7280', font: { family: "'DM Sans'" } }, grid: { color: '#1a1e28' } },
    y: { ticks: { color: '#6b7280', font: { family: "'DM Sans'" } }, grid: { color: '#1e2330' } }
  }
};

// ── Load CSV ──────────────────────────────────────────────────────────────────
function loadData() {
  document.getElementById('lastUpdate').textContent = 'Cargando…';
  Papa.parse(CSV_URL + '?t=' + Date.now(), {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: res => {
      processData(res.data);
      const now = new Date();
      document.getElementById('lastUpdate').textContent =
        `Actualizado: ${now.toLocaleDateString('es-MX')} ${now.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}`;
    },
    error: () => {
      document.getElementById('lastUpdate').textContent = 'Error al cargar datos';
    }
  });
}

// ── Parse ─────────────────────────────────────────────────────────────────────
function col(row, ...names) {
  for(const n of names) {
    const k = Object.keys(row).find(k => k.trim().toLowerCase() === n.toLowerCase());
    if(k !== undefined && row[k] !== undefined) return row[k];
  }
  return '';
}
function parseNum(v) { const n = parseFloat(String(v).replace(',','.')); return isNaN(n)?0:n; }
function parseFecha(str) {
  if(!str) return null;
  const m = str.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(m) return { str, mes:`${m[3]}-${String(m[2]).padStart(2,'0')}`, mesNum:+m[2], anio:+m[3] };
  return null;
}

function processData(rows) {
  DATA = [];
  rows.forEach(r => {
    const f = parseFecha(col(r,'Fecha','fecha'));
    if(!f) return;
    const sem  = parseInt(col(r,'Semana','semana'))||0;
    const lab  = col(r,'Laboratorio','Proveedor','laboratorio').trim();
    const prod = col(r,'Producto','producto').trim();
    const inc1 = col(r,'Incidencia 1').trim();
    const inc2 = col(r,'Incidencia 2').trim();
    const inc3 = col(r,'Incidencia 3').trim();
    const insp = parseNum(col(r,'Cantidad recibida','Piezas inspeccionadas'));
    const rech = parseNum(col(r,'Cantidad con incidencia','Piezas rechazadas'));
    if(!lab || !insp) return;
    DATA.push({ fechaStr:f.str, mes:f.mes, mesNum:f.mesNum, anio:f.anio, sem, lab, prod, insp, rech,
                defectos:[inc1,inc2,inc3].filter(Boolean).join(',') });
  });

  // assign colors
  const labs = [...new Set(DATA.map(r=>r.lab))].sort();
  LAB_COLORS = {};
  labs.forEach((l,i) => { LAB_COLORS[l] = LAB_COLORS_DEFAULT[l] || PALETTE[i % PALETTE.length]; });

  buildFilters();
  render();
}

// ── Filters ───────────────────────────────────────────────────────────────────
function buildFilters() {
  const labSel = document.getElementById('filtLab');
  labSel.innerHTML = '<option value="">Todos</option>';
  [...new Set(DATA.map(r=>r.lab))].sort().forEach(l => {
    const o = document.createElement('option'); o.value=l; o.textContent=l; labSel.appendChild(o);
  });
  const mesKeys = [...new Set(DATA.map(r=>r.mes))].sort();
  const mesSel = document.getElementById('filtMes');
  mesSel.innerHTML = '<option value="">Todos</option>';
  mesKeys.forEach(k => {
    const [a,m] = k.split('-');
    const o = document.createElement('option'); o.value=k; o.textContent=`${MESES[+m]} ${a}`; mesSel.appendChild(o);
  });
  rebuildSems(DATA);
  labSel.onchange = () => { rebuildSems(filtByLabMes()); render(); };
  mesSel.onchange = () => { rebuildSems(filtByLabMes()); render(); };
  document.getElementById('filtSem').onchange = render;
}

function filtByLabMes() {
  const lab = document.getElementById('filtLab').value;
  const mes = document.getElementById('filtMes').value;
  return DATA.filter(r => (!lab||r.lab===lab) && (!mes||r.mes===mes));
}

function rebuildSems(pool) {
  const sel = document.getElementById('filtSem');
  const cur = sel.value;
  sel.innerHTML = '<option value="">Todas</option>';
  [...new Set(pool.map(r=>r.sem))].filter(Boolean).sort((a,b)=>a-b).forEach(s => {
    const o = document.createElement('option'); o.value=s; o.textContent=`Semana ${s}`; sel.appendChild(o);
  });
  if([...sel.options].some(o=>o.value==cur)) sel.value=cur;
}

function filtered() {
  const sem = document.getElementById('filtSem').value;
  return filtByLabMes().filter(r => (!sem||r.sem==sem));
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const data = filtered();
  const totalInsp = data.reduce((a,r)=>a+r.insp,0);
  const totalRech = data.reduce((a,r)=>a+r.rech,0);
  const pct = totalInsp ? totalRech/totalInsp*100 : 0;
  const conInc = data.filter(r=>r.rech>0).length;
  const total  = data.length;
  const pctLotes = total ? conInc/total*100 : 0;

  const kpis = [
    { label:"Cantidad recibida",    value:totalInsp.toLocaleString('es-MX'), sub:"piezas totales",           cls:"info" },
    { label:"Con incidencia",       value:totalRech.toLocaleString('es-MX'), sub:`${pct.toFixed(2)}% del total`, cls: pct>3?"danger":pct>1?"warn":"ok" },
    { label:"% Incidencia",         value:pct.toFixed(2)+"%",                sub:"tasa general",              cls: pct>3?"danger":pct>1?"warn":"ok" },
    { label:"Lotes inspeccionados", value:total,                             sub:"registros totales",          cls:"info" },
    { label:"Lotes con incidencia", value:conInc,                            sub:`${pctLotes.toFixed(0)}% de lotes`, cls: pctLotes>50?"warn":"ok" },
  ];

  document.getElementById('kpiGrid').innerHTML = kpis.map(k=>`
    <div class="kpi ${k.cls}">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-value">${k.value}</div>
      <div class="kpi-sub">${k.sub}</div>
    </div>`).join('');

  renderBar(data); renderDef(data); renderLine(data); renderProd(data);
}

function renderBar(data) {
  const labs = [...new Set(data.map(r=>r.lab))].sort();
  const insp = labs.map(l=>data.filter(r=>r.lab===l).reduce((a,r)=>a+r.insp,0));
  const rech = labs.map(l=>data.filter(r=>r.lab===l).reduce((a,r)=>a+r.rech,0));
  if(chartBar) chartBar.destroy();
  chartBar = new Chart(document.getElementById('chartBar'),{
    type:'bar',
    data:{ labels:labs, datasets:[
      { label:'Recibido',       data:insp, backgroundColor:'#3b82f633', borderColor:'#3b82f6', borderWidth:2, borderRadius:6 },
      { label:'Con incidencia', data:rech, backgroundColor:'#ef444433', borderColor:'#ef4444', borderWidth:2, borderRadius:6 }
    ]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ ...CHART_DEFAULTS.plugins },
      scales:{ x:{ ...CHART_DEFAULTS.scales.x }, y:{ ...CHART_DEFAULTS.scales.y } }
    }
  });
}

function renderDef(data) {
  const tipos={};
  data.forEach(r=>{ if(r.defectos){ r.defectos.split(',').map(t=>t.trim()).filter(Boolean).forEach(t=>{ tipos[t]=(tipos[t]||0)+r.rech; }); } });
  const labels=Object.keys(tipos), vals=Object.values(tipos);
  document.getElementById('legDef').innerHTML = labels.map((l,i)=>
    `<span><span class="leg-dot" style="background:${PALETTE[i%PALETTE.length]}"></span>${l} (${vals[i]})</span>`).join('');
  if(chartDef) chartDef.destroy();
  chartDef = new Chart(document.getElementById('chartDef'),{
    type:'doughnut',
    data:{ labels, datasets:[{ data:vals, backgroundColor:PALETTE.map(c=>c+'99'), borderColor:PALETTE, borderWidth:2 }]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ ...CHART_DEFAULTS.plugins, tooltip:{ ...CHART_DEFAULTS.plugins.tooltip,
        callbacks:{ label: ctx => ` ${ctx.label}: ${ctx.parsed} pzas` }
      }},
      cutout:'65%'
    }
  });
}

function renderLine(data) {
  const byDate={};
  data.forEach(r=>{ const k=r.fechaStr; if(!byDate[k]) byDate[k]={insp:0,rech:0}; byDate[k].insp+=r.insp; byDate[k].rech+=r.rech; });
  const dates=Object.keys(byDate).sort((a,b)=>{ const pa=a.split('/'),pb=b.split('/'); return new Date(pa[2],pa[1]-1,pa[0])-new Date(pb[2],pb[1]-1,pb[0]); });
  const pcts=dates.map(d=>byDate[d].insp?+(byDate[d].rech/byDate[d].insp*100).toFixed(2):0);
  if(chartLine) chartLine.destroy();
  chartLine = new Chart(document.getElementById('chartLine'),{
    type:'line',
    data:{ labels:dates, datasets:[{ label:'% incidencia', data:pcts,
      borderColor:'#10b981', backgroundColor:'#10b98115',
      pointBackgroundColor:'#10b981', pointRadius:4, tension:0.4, fill:true }]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ ...CHART_DEFAULTS.plugins, tooltip:{ ...CHART_DEFAULTS.plugins.tooltip,
        callbacks:{ label: ctx => ` ${ctx.parsed.y}%` }
      }},
      scales:{
        x:{ ...CHART_DEFAULTS.scales.x, ticks:{ ...CHART_DEFAULTS.scales.x.ticks, maxRotation:45, autoSkip:true, font:{size:10,family:"'DM Sans'"} }},
        y:{ ...CHART_DEFAULTS.scales.y, ticks:{ ...CHART_DEFAULTS.scales.y.ticks, callback: v=>v+'%' }}
      }
    }
  });
}

function renderProd(data) {
  const byProd={};
  data.forEach(r=>{ if(!byProd[r.prod]) byProd[r.prod]={insp:0,rech:0,lab:r.lab}; byProd[r.prod].insp+=r.insp; byProd[r.prod].rech+=r.rech; });
  const prods=Object.keys(byProd).sort((a,b)=>(byProd[b].rech/byProd[b].insp)-(byProd[a].rech/byProd[a].insp));
  const pcts=prods.map(p=>byProd[p].insp?+(byProd[p].rech/byProd[p].insp*100).toFixed(2):0);
  const bgColors=prods.map(p=>(LAB_COLORS[byProd[p].lab]||'#6b7280')+'55');
  const bdColors=prods.map(p=>LAB_COLORS[byProd[p].lab]||'#6b7280');
  const labLeg=[...new Set(prods.map(p=>byProd[p].lab))];
  document.getElementById('legProd').innerHTML = labLeg.map(l=>
    `<span><span class="leg-dot" style="background:${LAB_COLORS[l]||'#6b7280'}"></span>${l}</span>`).join('');
  const h = Math.max(220, prods.length*38+60);
  const wrap = document.getElementById('prodWrap');
  wrap.innerHTML = `<canvas id="chartProd"></canvas>`;
  wrap.style.height = h+'px';
  if(chartProd){chartProd.destroy();chartProd=null;}
  chartProd = new Chart(document.getElementById('chartProd'),{
    type:'bar',
    data:{ labels:prods, datasets:[{ label:'% incidencia', data:pcts, backgroundColor:bgColors, borderColor:bdColors, borderWidth:2, borderRadius:6 }]},
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{ ...CHART_DEFAULTS.plugins, tooltip:{ ...CHART_DEFAULTS.plugins.tooltip,
        callbacks:{ label: ctx => ` ${ctx.parsed.x}%` }
      }},
      scales:{
        x:{ ...CHART_DEFAULTS.scales.x, ticks:{ ...CHART_DEFAULTS.scales.x.ticks, callback:v=>v+'%' }},
        y:{ ...CHART_DEFAULTS.scales.y, ticks:{ ...CHART_DEFAULTS.scales.y.ticks, font:{size:12,family:"'DM Sans'"} }}
      }
    }
  });
}



// ── PDF Export: imagen completa del dashboard ───────────────────────────────
function currentSummary(data) {
  const totalInsp = data.reduce((a,r)=>a+r.insp,0);
  const totalRech = data.reduce((a,r)=>a+r.rech,0);
  const pct = totalInsp ? totalRech/totalInsp*100 : 0;
  const conInc = data.filter(r=>r.rech>0).length;
  const total  = data.length;
  const pctLotes = total ? conInc/total*100 : 0;
  return { totalInsp, totalRech, pct, conInc, total, pctLotes };
}

function fillPdfCover() {
  const data = filtered();
  const s = currentSummary(data);
  const now = new Date();
  const lab = document.getElementById('filtLab').value || 'Todos los laboratorios';
  const mesSel = document.getElementById('filtMes');
  const mes = mesSel.value ? mesSel.options[mesSel.selectedIndex].text : 'Todos los meses';
  const semSel = document.getElementById('filtSem');
  const sem = semSel.value ? semSel.options[semSel.selectedIndex].text : 'Todas las semanas';
  document.getElementById('pdfExportMeta').textContent =
    `Generado el ${now.toLocaleDateString('es-MX')} a las ${now.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})} · ${lab} · ${mes} · ${sem}`;

  const items = [
    ['Cantidad recibida', s.totalInsp.toLocaleString('es-MX')],
    ['Con incidencia', s.totalRech.toLocaleString('es-MX')],
    ['% incidencia', `${s.pct.toFixed(2)}%`],
    ['Lotes inspeccionados', s.total.toLocaleString('es-MX')],
    ['Lotes con incidencia', `${s.conInc.toLocaleString('es-MX')} (${s.pctLotes.toFixed(0)}%)`],
  ];
  document.getElementById('pdfSummaryGrid').innerHTML = items.map(([label,value]) => `
    <div class="pdf-summary-item">
      <div class="pdf-summary-label">${label}</div>
      <div class="pdf-summary-value">${value}</div>
    </div>`).join('');
}

function waitForChartsReady() {
  return new Promise(resolve => {
    requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(resolve, 500)));
  });
}

function copyCanvasContent(sourceRoot, clonedDoc) {
  const sourceCanvases = sourceRoot.querySelectorAll('canvas');
  const clonedCanvases = clonedDoc.querySelectorAll('#pdfCaptureRoot canvas');
  sourceCanvases.forEach((sourceCanvas, index) => {
    const clonedCanvas = clonedCanvases[index];
    if (!clonedCanvas) return;
    const ctx = clonedCanvas.getContext('2d');
    clonedCanvas.width = sourceCanvas.width;
    clonedCanvas.height = sourceCanvas.height;
    clonedCanvas.style.width = sourceCanvas.style.width || sourceCanvas.getBoundingClientRect().width + 'px';
    clonedCanvas.style.height = sourceCanvas.style.height || sourceCanvas.getBoundingClientRect().height + 'px';
    ctx.drawImage(sourceCanvas, 0, 0);
  });
}

async function exportPDF() {
  const btn = document.getElementById('btnPDF');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Generando PDF…';

  try {
    fillPdfCover();
    document.body.classList.add('pdf-exporting');
    window.scrollTo(0, 0);
    await waitForChartsReady();

    // Se captura un solo bloque completo: encabezado + dashboard.
    // Después esa imagen larga se corta únicamente para acomodarla en páginas A4.
    const captureRoot = document.createElement('div');
    captureRoot.id = 'pdfCaptureRoot';
    captureRoot.style.position = 'fixed';
    captureRoot.style.left = '-10000px';
    captureRoot.style.top = '0';
    captureRoot.style.width = '1400px';
    captureRoot.style.background = '#0d0f14';
    captureRoot.style.color = '#e8eaf0';
    captureRoot.style.zIndex = '-1';
    captureRoot.style.overflow = 'visible';

    const headerClone = document.querySelector('.header').cloneNode(true);
    const mainClone = document.querySelector('.main').cloneNode(true);
    headerClone.querySelector('#btnPDF')?.remove();
    captureRoot.appendChild(headerClone);
    captureRoot.appendChild(mainClone);
    document.body.appendChild(captureRoot);

    await waitForChartsReady();

    const canvas = await html2canvas(captureRoot, {
      scale: 1.6,
      backgroundColor: '#0d0f14',
      useCORS: true,
      allowTaint: true,
      logging: false,
      scrollX: 0,
      scrollY: 0,
      windowWidth: captureRoot.scrollWidth,
      windowHeight: captureRoot.scrollHeight,
      width: captureRoot.scrollWidth,
      height: captureRoot.scrollHeight,
      onclone: clonedDoc => {
        copyCanvasContent(captureRoot, clonedDoc);
        clonedDoc.querySelectorAll('#pdfCaptureRoot *').forEach(el => {
          el.style.animation = 'none';
          el.style.transition = 'none';
        });
        const clonedHeader = clonedDoc.querySelector('#pdfCaptureRoot .header');
        if (clonedHeader) clonedHeader.style.position = 'static';
      }
    });

    captureRoot.remove();

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const margin = 5;
    const usableWidth = pageWidth - margin * 2;
    const usableHeight = pageHeight - margin * 2;

    // Convertimos una sola imagen larga y la vamos cortando por altura.
    const imgWidthMm = usableWidth;
    const pxPerMm = canvas.width / imgWidthMm;
    const pageSliceHeightPx = Math.floor(usableHeight * pxPerMm);

    let sourceY = 0;
    let page = 0;

    while (sourceY < canvas.height) {
      const sliceHeight = Math.min(pageSliceHeightPx, canvas.height - sourceY);
      const pageCanvas = document.createElement('canvas');
      pageCanvas.width = canvas.width;
      pageCanvas.height = sliceHeight;
      const pageCtx = pageCanvas.getContext('2d');
      pageCtx.fillStyle = '#0d0f14';
      pageCtx.fillRect(0, 0, pageCanvas.width, pageCanvas.height);
      pageCtx.drawImage(canvas, 0, sourceY, canvas.width, sliceHeight, 0, 0, canvas.width, sliceHeight);

      const pageImg = pageCanvas.toDataURL('image/jpeg', 0.95);
      const sliceHeightMm = sliceHeight / pxPerMm;
      if (page > 0) pdf.addPage();
      pdf.addImage(pageImg, 'JPEG', margin, margin, usableWidth, sliceHeightMm);

      sourceY += sliceHeight;
      page++;
    }

    const fileDate = new Date().toISOString().split('T')[0];
    pdf.save(`Dashboard_Calidad_${fileDate}.pdf`);
  } catch (err) {
    console.error(err);
    alert('No se pudo generar el PDF. Intenta recargar la página y vuelve a probar.');
  } finally {
    document.querySelector('#pdfCaptureRoot')?.remove();
    document.body.classList.remove('pdf-exporting');
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

document.getElementById('btnPDF').addEventListener('click', exportPDF);

// ── Boot ──────────────────────────────────────────────────────────────────────
loadData();
</script>
